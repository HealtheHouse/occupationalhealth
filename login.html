<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود به پرونده الکترونیک بهداشت محیط و حرفه‌ای</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:#f5f7fb;font-family:Vazirmatn,Tahoma,sans-serif;color:#16302c;display:flex;align-items:center;justify-content:center;padding:28px;position:relative;overflow:auto}
.card{width:min(430px,100%);background:rgba(255,255,255,.94);backdrop-filter:blur(5px);border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 12px 40px #0001}
h1{text-align:center;font-size:25px;margin:0 0 8px}.sub{text-align:center;color:#667085;margin:0 0 25px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:10px;font-family:inherit;font-size:15px;direction:ltr;text-align:left}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-family:inherit;font-weight:700;font-size:14px;margin-top:18px;cursor:pointer}
.msg{margin-top:12px;font-size:13px;color:#b42318;text-align:center;min-height:20px}
.note{margin-top:18px;padding:10px;background:#f8fafc;border-radius:9px;font-size:11px;color:#667085}
@media(max-width:700px){body{padding:14px;align-items:center}.card{padding:22px}.hh-login-layout{width:100%;max-width:430px}.hh-login-hero-box{height:clamp(120px,24vh,210px)}} </style>
<style>
.hh-login-hero{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:#dfe9df;overflow:hidden}
.hh-login-slide{position:absolute;inset:0;width:100%;height:100%;display:none;object-fit:cover;object-position:center center}
.hh-login-slide.active{display:block}
.hh-login-hero:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.08);pointer-events:none}
.hh-login-dots{position:absolute;bottom:18px;left:0;right:0;text-align:center;z-index:3}
.hh-login-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin:0 4px;box-shadow:0 1px 4px #0006}
.hh-login-dot.active{background:#0e5952}
.hh-login-layout{width:min(520px,100%);display:flex;flex-direction:column;position:relative;z-index:2}
.hh-login-card-slot{display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:min(430px,100%);background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border:1px solid rgba(226,232,240,.9);border-radius:20px;padding:28px;box-shadow:0 12px 40px #0004}
@media(max-width:700px){body{padding:14px;align-items:center}.card{padding:22px}.hh-login-layout{width:100%;max-width:430px}}
</style></style></head>
<body><div class="hh-login-layout">
<section class="hh-login-hero" aria-label="بنرهای بهداشت محیط و حرفه‌ای">
<img class="hh-login-slide active" src="banner_mohit_story.jpg" alt="بهداشت محیط">
<img class="hh-login-slide" src="banner_herfei_story.jpg" alt="بهداشت حرفه‌ای و ایمنی">
<div class="hh-login-dots"><span class="hh-login-dot active"></span><span class="hh-login-dot"></span></div>
</section>
<div class="hh-login-card-slot">

<div class="card">
  <h1>پرونده الکترونیک بهداشت محیط و حرفه‌ای</h1>
  <p class="sub">ورود کاربران برای دسترسی به فرم‌ها</p>
  <form id="loginForm">
    <label for="nationalCode">کد ملی</label>
    <input id="nationalCode" inputmode="numeric" maxlength="10" autocomplete="username" placeholder="کد ملی ده رقمی">
    <label for="password">رمز عبور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور">
    <button type="submit">ورود به سامانه</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="note">پس از ورود، در صفحه اصلی می‌توانید با کلیک روی فرم‌ها وارد فرم بازرسی شوید.</div>
</div>
<script>
const form=document.getElementById('loginForm');
const msg=document.getElementById('msg');
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const code=document.getElementById('nationalCode').value.trim().replace(/[^0-9۰-۹]/g,'');
  const pass=document.getElementById('password').value;
  if(code.length!==10){msg.textContent='کد ملی باید ۱۰ رقم باشد.';return}
  if(!pass){msg.textContent='رمز عبور را وارد کنید.';return}
  msg.textContent='در حال بررسی اطلاعات ورود...';
  const email = code + '@nationalcode.healthhouse.local';
  try {
    const r = await fetch('https://vjzxmnqwqztjjwpwlsjo.supabase.co/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'apikey':'sb_publishable_ADC2yOmAgXglc3sT6ZoTXQ_jjmeHGjk','Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const d = await r.json();
    if(!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || 'کد ملی یا رمز عبور صحیح نیست.');
    sessionStorage.setItem('hh_portal_auth','1');
    sessionStorage.setItem('hh_national_code',code);
    sessionStorage.setItem('hh_access_token',d.access_token);
    sessionStorage.setItem('hh_refresh_token',d.refresh_token||'');
    location.href='dashboard.html';
  } catch(err) {
    msg.textContent='ورود ناموفق: '+(err.message||'اطلاعات ورود صحیح نیست.');
  }
});
</script>
</div></div><script>
(function(){
 const s=document.querySelectorAll('.hh-login-slide'),d=document.querySelectorAll('.hh-login-dot');
 let i=0; setInterval(()=>{s[i].classList.remove('active');d[i].classList.remove('active');i=(i+1)%s.length;s[i].classList.add('active');d[i].classList.add('active')},5000);
})();
</script>
</body>
</html>
